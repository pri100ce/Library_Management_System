{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="card" style="max-width:650px;margin:auto;">

<h1 class="page-title">

Register Student

</h1>

<p class="subtitle">

Create a new student account.

</p>

<form method="POST">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="name"
required>

</div>

<div class="form-group">

<label>Class</label>

<input
type="text"
name="class"
required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="text"
name="phone"
required>

</div>

<div class="form-group">

<label>Password</label>

<!-- <input
type="password"
name="password"
value="student123"
required> -->

<div class="password-box">

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Set Account Password"
        value="student123"
        required
    >

    <button
        type="button"
        id="togglePassword"
        class="password-toggle"
        aria-label="Show or hide password"
    >
        <i class="fa-solid fa-eye-slash"></i>
    </button>

</div>

</div>

<button
type="submit"
class="btn btn-success">

Register Student

</button>

<a
href="{{ url_for('admin_dashboard') }}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

{% endblock %}
