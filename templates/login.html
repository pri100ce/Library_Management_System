{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}


<div style="max-width:450px;margin:60px auto;">

    <div class="card">

        <div style="text-align:center;margin-bottom:30px;">

            <div style="font-size:70px;">
                📚
            </div>

            <h1 class="page-title">
                Library Management
            </h1>


            <p class="subtitle">
                Sign in to continue
            </p>

        </div>

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">

            <div class="form-group">

                <label>

                    Login As

                </label>

                <select name="role" required>

                    <option value="student">

                        👨‍🎓 Student

                    </option>

                    <option value="admin">

                        👤 Librarian / Admin

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>

                    Username / Student ID

                </label>

                <input

                    type="text"

                    name="username"

                    placeholder="Enter username"

                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <input

                    type="password"

                    name="password"

                    placeholder="Enter password"

                    required>

            </div>

            <div style="margin-top:25px;">

                <button

                    type="submit"

                    class="btn btn-primary"

                    style="width:100%;">

                    Login

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
